<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Internal tool plus a public intake form; neither belongs in search results. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- IBM Plex Sans and Mono. The mono is not decorative: DAM paths,
         perceptual hashes, URLs and job ids appear on nearly every view, and
         they need to align and be read character by character. Weights are
         limited to the four actually used so the payload stays small. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />

    <title>SEI Site Auditor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
